<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    
    <link id="site-favicon" rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">

    <!-- UGS Import -->
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>

    <!-- CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        :root{
            --base-color: #010101;
            --surface-color: #272727;

            --brand-color: #0d57c7;

            --text-color: #f9f9f9;
            --text-secondary: #cfcdcd;
        }
        *{
            margin: 0;
            padding: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        } *::-webkit-scrollbar{
            display: none;
        }
        *.hidden{
            display: none;
        }
        body{
            background-color: var(--base-color);
            background-size: cover;
            background-repeat: no-repeat;
            backdrop-filter: blur(5px) brightness(0.5);
            position: relative;
            min-width: 100%;
            min-height: 100vh;
            max-height: 100vh;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            color: var(--text-secondary);
            font-family: "Nuntio", Arial, Helvetica, sans-serif;
        }
        h1, h2, h3, h4, h5, h6{
            color: var(--text-color);
            font-family: "Exo 2", Arial, Helvetica, sans-serif;
        }
        nav{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 100;
        }
        nav.bottom{
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }
        nav.top{
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }
        nav.right{
            flex-direction: column;
            align-items: flex-end;
            position: fixed;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
        }
        nav.left{
            flex-direction: column;
            align-items: flex-start;
            position: fixed;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
        }
        nav .app{
            background: color-mix(in srgb, var(--brand-color), transparent 40%);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            transition: 0.3s ease;
        }
        nav .app .nav-text{
            color: var(--text-color);
            font-size: 1.02rem;
        }
        nav .app .nav-icon{
            fill: var(--text-color);
        }
        nav .app:hover{
            scale: 1.15;
        }
        nav .app:active{
            scale: 0.85;
        }
        .glow{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            aspect-ratio: 1/1;
            background: radial-gradient(color-mix(in srgb, var(--brand-color), transparent 80%), transparent);
        }
        main{
            position: fixed;
            top: 2rem;
            left: 2rem;
            right: 2rem;
            bottom: 2rem;
        }
        section{
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            scale: 0.5;
            visibility: hidden;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        section.active{
            opacity: 1;
            scale: 1;
            visibility: visible;
        }
        .lettermark{
            z-index: 50;
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            flex-direction: column;
            color: white;
            opacity: 0.3;
        }
        .lettermark p{
            text-transform: uppercase;
            font-family: monospace;
        }
        .lettermark h4{
            font-family: "Nunito", Arial, Helvetica, sans-serif;
            font-weight: 900;
            user-select: none;
        } 
    </style>
    
    <!-- Home CSS -->
    <style>
        #home{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        #home h1{
            font-size: min(6rem, 80vw);
            color: var(--brand-color);
            font-family: "Exo 2", Arial, Helvetica, sans-serif;
        }
        #home .subtext{
            color: color-mix(in srgb, var(--text-secondary), transparent 20%);
            font-size: 1.25rem;
            font-family: "Nunito", Arial, Helvetica, sans-serif;
        }
        #home .author{
            color: color-mix(in srgb, var(--text-secondary), transparent 40%);
            font-family: "Nunito", Arial, Helvetica, sans-serif;
        }
    </style>

    <!-- Games CSS -->
    <style>
        #games{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 2rem;
            padding: 3rem;
        }
        #games h2{
            font-size: 3rem;
        }
        #games input[type="text"]{
            color: var(--text-color);
            padding: 1rem;
            border: 1px solid var(--surface-color);
            background-color: var(--base-color);
            width: 400px;
            border-radius: 15px;
        }
        #games input[type="text"]:focus{
            outline: none;
            border: 1px solid var(--brand-color);
            box-shadow: 0 0 5px var(--brand-color);
        }
        #games #games-container{
            height: 100%;
            overflow-y: scroll;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        #games #games-container .game{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: var(--surface-color);
            flex: 0;
            width: fit-content;
            padding: 1rem 1.5rem;
            border-radius: 15px;
            font-size: 1rem;
        }
        #games #games-container .game button{
            background-color: var(--brand-color);
            border: none;
            padding: 1rem 1.75rem;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>

    <!-- Setup -->
    <script type="module">
        import LZString from 'https://cdn.jsdelivr.net/npm/lz-string@1.5.0/+esm';
        const siteURL = new URL(window.location.href);
        const config = unpackConfig(siteURL.searchParams.get('c'));

        document.getElementById('site-title').innerText = config.name;
        document.getElementById('site-subtext').innerText = config.subtext;
        document.getElementById('site-creator'). innerText =`Made by: ${config.creator}`;
        document.getElementById('games-author').innerText = config.creator;

        const root = document.documentElement;
        root.style.setProperty('--base-color', config.bac); 
        root.style.setProperty('--surface-color', config.suc); 
        root.style.setProperty('--brand-color', config.brc); 
        root.style.setProperty('--text-color', config.tec); 
        root.style.setProperty('--text-secondary', config.tsc); 

        document.title = `${config.name} | Made by: ${config.creator}`;

        if (config.bgi) {
            document.body.style.backgroundImage = `url('${config.bgi}')`;
        }
        if (config.fai) {
            document.getElementById('site-favicon').href = config.fai;
        }

        switch (config.labn) {
            case "icon":
                const text = document.querySelectorAll('.nav-text');
                text.forEach((el) => {
                    el.classList.add('hidden');
                });
                break;
            case "text":
                const icons = document.querySelectorAll('.nav-icon');
                icons.forEach((el) => {
                    el.classList.add('hidden');
                })
                break;
            default:
                break;
        }

        document.querySelector("nav").classList.add(config.navl);

        console.log(JSON.stringify(config));

        function unpackConfig(compressedUrlString) {
            if (!compressedUrlString) return null;
            const jsonString = LZString.decompressFromEncodedURIComponent(compressedUrlString);
            return JSON.parse(jsonString);
        }
    </script>

    <!-- Btn functionality -->
    <script type="module">
        let currentWin = 'home';
        function switchToWindow(name) {
            document.getElementById(currentWin).classList.remove('active');
            currentWin = name;
            document.getElementById(currentWin).classList.add('active');
        }

        // Btns sutffsss
        const homeBtn = document.getElementById('home-btn');
        homeBtn.addEventListener("click", () => { switchToWindow('home') });

        const gamesBtn = document.getElementById('games-btn');
        gamesBtn.addEventListener("click", () => { switchToWindow('games') });

        const chatBtn = document.getElementById('chat-btn');
        chatBtn.addEventListener("click", () => { switchToWindow('chat') });

        const chatbotBtn = document.getElementById('chatbot-btn');
        chatbotBtn.addEventListener("click", () => { switchToWindow('chatbot') });

        const notesBtn = document.getElementById('notes-btn');
        notesBtn.addEventListener("click", () => { switchToWindow('notes') });

        const codeBtn = document.getElementById('code-btn');
        codeBtn.addEventListener("click", () => { switchToWindow('code') });
    </script>

    <!-- Games App -->
    <script>
        function initGameCards() {
            const gamesContainer = document.getElementById('games-container');
            let newHTML = ``;
            for (let f of files) {
                const gameName= f.slice(2);
                const gameURL = `https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/${f}.html`;

                newHTML += `
                    <div class="game">
                        <span class="name">${gameName}</span>
                        <button onclick="openGameTab('${gameURL}')">Play</button>
                    </div>
                `;
            }
            gamesContainer.innerHTML = newHTML;
        }

        initGameCards();

        function openGameTab(url) {
            fetch(url)
            .then(response => response.text())
            .then(text => {
                const newWin = window.open("about:blank", "_blank");
                if (newWin) {
                    newWin.document.open();
                    newWin.document.write(text);
                    newWin.document.close();
                }
            });
        }
    </script>
