<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    
    <link id="site-favicon" rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">

    <!-- UGS Import -->
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>

    <!-- CDN Imports -->

    <!-- PEER IMPORT -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <!-- LDR Import -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/ldrs/dist/auto/trio.js"></script>

    <!-- CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        :root{
            --base-color: #010101;
            --surface-color: #272727;

            --brand-color: #0d57c7;

            --text-color: #f9f9f9;
            --text-secondary: #cfcdcd;

             --success-color: #35c759;
            --warning-color: #ffcc00;
            --error-color: #ff453a;
            --info-color: #32ade6;
        }
        *{
            margin: 0;
            padding: 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        } *::-webkit-scrollbar{
            display: none;
        }
        *.hidden{
            display: none;
        }
        body{
            background-color: var(--base-color);
            background-size: cover;
            background-repeat: no-repeat;
            backdrop-filter: blur(5px) brightness(0.5);
            position: relative;
            min-width: 100%;
            min-height: 100vh;
            max-height: 100vh;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            color: var(--text-secondary);
            font-family: "Nunito", Arial, Helvetica, sans-serif;
        }
        h1, h2, h3, h4, h5, h6{
            color: var(--text-color);
            font-family: "Exo 2", Arial, Helvetica, sans-serif;
        }
        p, a, span{
            color: var(--text-secondary);
            font-family: "Nuntio", Arial, Helvetica, sans-serif;
        }
        nav{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 100;
        }
        nav.bottom{
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }
        nav.top{
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }
        nav.right{
            flex-direction: column;
            align-items: flex-end;
            position: fixed;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
        }
        nav.left{
            flex-direction: column;
            align-items: flex-start;
            position: fixed;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
        }
        nav .app{
            background: color-mix(in srgb, var(--brand-color), transparent 40%);
            padding: 0.75rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            transition: 0.3s ease;
        }
        nav .app .nav-text{
            color: var(--text-color);
            font-size: 1.02rem;
        }
        nav .app .nav-icon{
            fill: var(--text-color);
        }
        nav .app:hover{
            scale: 1.05;
        }
        nav .app:active{
            scale: 0.98;
        }
        .glow{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            aspect-ratio: 1/1;
            background: radial-gradient(color-mix(in srgb, var(--brand-color), transparent 80%), transparent);
        }
        main{
            position: fixed;
            top: 2rem;
            left: 2rem;
            right: 2rem;
            bottom: 2rem;
        }
        section{
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0;
            scale: 0.5;
            visibility: hidden;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        section.active{
            opacity: 1;
            scale: 1;
            visibility: visible;
        }
        .lettermark{
            z-index: 50;
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            flex-direction: column;
            color: white;
            opacity: 0.3;
        }
        .lettermark p{
            text-transform: uppercase;
            font-family: monospace;
        }
        .lettermark h4{
            font-family: "Nunito", Arial, Helvetica, sans-serif;
            font-weight: 900;
            user-select: none;
        } 
    </style>
    
    <!-- Home CSS -->
    <style>
        #home{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        #home h1{
            font-size: min(6rem, 80vw);
            color: var(--brand-color);
            font-family: "Exo 2", Arial, Helvetica, sans-serif;
        }
        #home .subtext{
            color: color-mix(in srgb, var(--text-secondary), transparent 20%);
            font-size: 1.25rem;
            font-family: "Nunito", Arial, Helvetica, sans-serif;
        }
        #home .author{
            color: color-mix(in srgb, var(--text-secondary), transparent 40%);
            font-family: "Nunito", Arial, Helvetica, sans-serif;
        }
    </style>

    <!-- Featured CSS -->
    <style>
        #featured{
            overflow-y: scroll;
            margin: 3rem;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 20px;
            flex-direction: column;
        }
        #featured h2{
            font-size: 4rem;
        }
        #featured .games{
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            grid-auto-rows: 300px;
            gap: 20px;
        }
        #featured .game{
            position: relative;
            overflow: hidden;
            border: none;
            border-radius: 1rem;
            cursor: pointer;
            transition: 150ms ease;
        }
        #featured .game:hover{
            transform: translateY(-3px);
        }
        #featured .game:active{
            transform: translateY(0);
        }
        #featured .game img{
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px) brightness(0.5);
        }
        #featured .game .text{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
        }
        #featured .game .text h3{
            font-size: 3rem;
        }
        #featured .game .text p{
            font-size: 1.2rem;
        }
    </style>

    <!-- Games CSS -->
    <style>
        #games{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 2rem;
            padding: 3rem;
        }
        #games h2{
            font-size: 3rem;
        }
        #games input[type="text"]{
            color: var(--text-color);
            padding: 1rem;
            border: 1px solid var(--surface-color);
            background-color: var(--base-color);
            width: 400px;
            border-radius: 15px;
        }
        #games input[type="text"]:focus{
            outline: none;
            border: 1px solid var(--brand-color);
            box-shadow: 0 0 5px var(--brand-color);
        }
        #games #games-container{
            height: 100%;
            overflow-y: scroll;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        #games #games-container .game{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            background-color: var(--surface-color);
            flex: 0;
            width: fit-content;
            padding: 1rem 1.5rem;
            border-radius: 15px;
            font-size: 1rem;
        }
        #games #games-container .game button{
            background-color: var(--brand-color);
            border: none;
            padding: 1rem 1.75rem;
            border-radius: 10px;
            color: var(--text-color);
            font-size: 1rem;
            cursor: pointer;
        }
    </style>

    <!-- Chat CSS -->
    <style>
        #chat{
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            padding: 3rem 4rem;
            height: 100%;
            box-sizing: border-box;
        }
        #chat .load-screen{
            position: absolute; 
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            flex-direction: column;
            background-color: var(--surface-color);
            user-select: none;
            z-index: 9999;

            opacity: 1;
            visibility: visible;
            border-radius: 15px;
            box-sizing: border-box;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #chat .load-screen.hidden{
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #chat .card{
            max-width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            background-color: var(--surface-color);
            padding: 2rem 3rem;
            border-radius: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #chat .card hr{
            width: 100%;
            border: 1px solid color-mix(in srgb, var(--text-secondary), transparent 80%);
        }
        #chat .card h1 {
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;
            text-wrap: balance;
            text-align: center;
        }
        #chat .card h2 {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        #chat .card .container{
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            flex-direction: column;
        }
        #chat #join-form {
            width: 100%;
            display: flex;
            gap: 0.75rem;
        }
        #chat input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 2px solid  oklch(from var(--surface-color) calc(l* 1.2) c h);
            background-color: var(--surface-color);
            outline: none;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            caret-color: var(--text-secondary);
            color: var(--text-secondary)
        }
        #chat input[type="text"]:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 12px var(--brand-color);
        }
        #chat input[type="text"]::placeholder {
            color: var(--text-secondary);
        }
        #chat button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            background: var(--brand-color);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-color);
            transition: all 0.25s ease;
            box-shadow: 0 0 5px var(--brand-color);
        }
        #chat button:hover {
            transform: translateY(-2px);
        }
        #chat button:active {
            transform: translateY(0);
        }
        #chat-sys{
            position: relative;
            width: 100%;
            height: 100%;
        }
        #chat #create-room-btn {
            width: 100%;
        }
        #chat #chat-sys #send-message-form {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            width: 90%;
        }
        #chat #chat-sys #send-message-form input[type="text"] {
            flex: 1;
        }
        #chat #chat-sys legend{
            padding: 1rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.2rem;
            border: 2px solid oklch(from var(--surface-color) calc(l* 1.2) c h);
            border-radius: 10px;
        }
        #chat #chat-sys fieldset{
            position: relative;
            height: 100%;
            border: 2px solid oklch(from var(--surface-color) calc(l* 1.2) c h);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #chat #chat-sys message-box{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 2rem;
            box-sizing: border-box;
            overflow: scroll;
            padding-bottom: 100px;
        }
        #chat #chat-sys message-bubble{
            font-size: 1.2rem;
        }
        #chat #chat-sys message-bubble.info p{
            color: grey;
        }
        #chat #chat-sys message-bubble.warn p{
            color: red;
        }
        #chat #chat-sys #show-change-username-btn{
            background-color: var(--brand-color);
            aspect-ratio: 1/1;
            border-radius: 50%;
            padding: 1rem;
            position: absolute;
            top: -20px;
            right: -50px;
            transform: translate(-50%, -50%);
            z-index: 50;
        }
        #chat #chat-sys #show-change-username-btn svg{
            fill: var(--text-color);
        }
        #chat #chat-sys #change-username-btn:hover{
            scale: 1.1;
        }
        #chat #chat-sys dialog{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--surface-color);
            border: none;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            z-index: 9999999999999;
        }
        #chat #chat-sys #change-username-form{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        #chat #chat-sys dialog:not([open]) {
            display: none !important;
        }
        #chat #chat-sys dialog::backdrop{
            background-color: #09001444;
            backdrop-filter: blur(5px);
        }
        #chat #chat-sys dialog{
            z-index: 9999999999999;
        }
    </style>

    <!-- Draw App CSS -->
    <style>
        #draw {
            padding: 3rem;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }
        #draw-fullscreen {
            position: absolute;
            top: 4rem;
            right: 4rem;
            background-color: color-mix(in srgb, var(--brand-color), transparent 40%);
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            cursor: pointer;
            z-index: 10;
            transition: 0.2s ease;
        }
        #draw-fullscreen:hover {
            scale: 1.1;
        }
        #draw .ui {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }
        #draw-canvas {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: crosshair;
            touch-action: none;
        }
        #draw .toolbar {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: var(--surface-color);
            padding: 0.75rem 1.25rem;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid color-mix(in srgb, var(--text-secondary), transparent 80%);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        #draw .toolbar button {
            background-color: var(--brand-color);
            color: var(--text-color);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            font-family: "Nunito", Arial, sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.2s ease;
        }
        #draw .toolbar button:hover {
            scale: 1.05;
            filter: brightness(1.1);
        }
        #draw .toolbar button:active {
            scale: 0.95;
        }
        #draw .toolbar input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 36px;
            height: 36px;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
        #draw .toolbar input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        #draw .toolbar input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--text-color);
            border-radius: 50%;
        }
        #draw .toolbar input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 6px;
            background: color-mix(in srgb, var(--text-secondary), transparent 60%);
            border-radius: 5px;
            outline: none;
        }
        #draw .toolbar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--brand-color);
            cursor: pointer;
            transition: 0.15s ease;
        }
        #draw .toolbar input[type="range"]::-webkit-slider-thumb:hover {
            scale: 1.2;
        }
    </style>

    <!-- Game Player -->
    <style>
        #game-player {
            margin: 0;               /* Remove margin to allow full-size scaling */
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;        /* Prevent scrollbars on the container */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-player iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 15px;
            overflow: hidden;        /* Prevent iframe native scrollbars */
        }
        #game-player #game-player-fullscreen{
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background-color: color-mix(in srgb, var(--brand-color), transparent 40%);
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

        <p>Powered By:</p>
        <h4>CreateQOS</h4>
    </div>
    <div class="glow"></div>

        <button class="app" id="home-btn">
            <p class="nav-text">Home</p>

            <p class="nav-text">Games</p>
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m272-440 208 120 208-120-168-97v137h-80v-137l-168 97Zm168-189v-17q-44-13-72-49.5T340-780q0-58 41-99t99-41q58 0 99 41t41 99q0 48-28 84.5T520-646v17l280 161q19 11 29.5 29.5T840-398v76q0 22-10.5 40.5T800-252L520-91q-19 11-40 11t-40-11L160-252q-19-11-29.5-29.5T120-322v-76q0-22 10.5-40.5T160-468l280-161Zm0 378L200-389v67l280 162 280-162v-67L520-251q-19 11-40 11t-40-11Zm82.5-486.5Q540-755 540-780t-17.5-42.5Q505-840 480-840t-42.5 17.5Q420-805 420-780t17.5 42.5Q455-720 480-720t42.5-17.5ZM480-160Z"/></svg>
        </button>
        <button class="app" id="chat-btn">
            <p class="nav-text">Chat</p>
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z"/></svg>
        </button>

            if (!compressedUrlString) return null;

    <script>
        function getJsDelivrUrl(githubUrl) {
            // Pattern matches: https://github.com/user/repo/blob/branch/path/to/file.js
            const githubPattern = /^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/;
            const match = githubUrl.match(githubPattern);

            if (!match) {
                throw new Error("Invalid GitHub file URL format.");
            }

            const [, user, repo, version, filePath] = match;
            return `https://cdn.jsdelivr.net/gh/${user}/${repo}@${version}/${filePath}`;
        }
        function openGithub(url) {
            const jsDelivrUrl = getJsDelivrUrl(url);
            fetch(jsDelivrUrl)
            .then(response => response.text())
            .then(text => {
                const newWin = window.open("about:blank", "_blank");
                if (newWin) {
                    newWin.document.open();
                    newWin.document.write(text);
                    newWin.document.close();
                }
            });
        }
    </script>

                if (gameName.toLowerCase().includes(query)) {
                    const gameURL = `https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/UGS-Files/${f}.html`;
                    newHTML += `
                        <div class="game">
                            <span class="name">${gameName}</span>
                            <button onclick="openGameTab('${gameURL}')">Play</button>
                        </div>
                    `;
                }
            }
            
            gamesContainer.innerHTML = newHTML;
        }

        // Initial render
        renderGames();

        // Listen for typing in the search box
        searchInput.addEventListener('input', (e) => {
            renderGames(e.target.value);
        });

        function openGameTab(url) {
            fetch(url)
            .then(response => response.text())
            .then(text => {
                const newWin = window.open("about:blank", "_blank");
                if (newWin) {
                    newWin.document.open();
                    newWin.document.write(text);
                    newWin.document.close();
                }
            });
        }
    </script>

    <!-- Chat App -->
    <script>
        // ! USERNAME MANAGER
        const peerMap = {};
        let USERNAME = "user";
        for(let i = 0; i < 6; i++) {
            USERNAME += String(Math.floor(Math.random() * 10));
        }

        const showUserModalBtn= document.getElementById('show-change-username-btn');
        showUserModalBtn.addEventListener("click", () => {
            document.getElementById('change-username').value = USERNAME;
            document.getElementById('change-username-modal').showModal();
        });

        // ! HELPERS
        function addMessageToDOM(type, username, text, color) {
            const messageBox = document.querySelector('message-box');
            const bubble = document.createElement('message-bubble');
            if(type === 'MESSAGE') {
                const h3 = document.createElement('h3');
                if(username === USERNAME) {
                    h3.textContent = "You";
                    h3.style.color = "#FFFFFF";
                } else {
                    h3.textContent = username;
                    h3.style.color = color;
                }
                bubble.appendChild(h3);
                bubble.classList.add('message');
            } else {
                if(type === 'INFO') {
                    bubble.classList.add('info');
                } else {
                    if(type === 'WARN') {
                        bubble.classList.add('warn');
                    }
                }
            }
            const p = document.createElement('p');
            p.textContent = text;
            
            bubble.appendChild(p);
            messageBox.appendChild(bubble);

            messageBox.scrollTop = messageBox.scrollHeight;
        }
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 75%, 45%)`;
        }
        function getFunnyLeaveMessage(username) {
            const messages = [
                `${username} rage quit!`,
                `${username} vanished into the shadow realm.`,
                `${username} left to go get milk and never came back.`,
                `${username} disconnected. Probably lost their Wi-Fi to a squirrel.`,
                `${username} has left the chat. Fs in the chat, boys.`,
                `${username} went 2-3 years to dagestan.`
            ];
            return messages[Math.floor(Math.random() * messages.length)];
        }
    
        // ! BOTH
        let peer;
        const loadScreen = document.getElementById('chat-ldr-screen');
        const startScreen = document.getElementById('chat-start');
        const chatScreen = document.getElementById('chat-sys');
        function switchToChat() {
            startScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
        }

        // HOSTING
        let hostColor;
        let connectedPeers = {};

        // get join thingy magigy
        const createRoomBtn = document.getElementById('create-room-btn');
        createRoomBtn.addEventListener("click", () => {

            // Genertae room code
            const codeOutput = document.getElementById('room-code');
            let roomCode = "Q";
            for( let i = 0; i < 6; i++) {
                roomCode += String(Math.floor(Math.random() * 10));
            }
            codeOutput.innerText = roomCode;

            // Peer connection headache
            if(!peer) {
                peer = new Peer(roomCode);
            }

            peer.on('open', (id) => {
                switchToChat();
                console.log('Room created successfully with ID:', id);
                hostColor = getRandomColor();

                // send message
                const sendMsgForm = document.getElementById('send-message-form');
                sendMsgForm.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const msg = document.getElementById('send-message').value;
                    broadcastMessage('MESSAGE', USERNAME, msg, hostColor);
                    sendMsgForm.reset();
                });

                const changeUserForm = document.getElementById('change-user-form');
                    changeUserForm.addEventListener("submit", (e) => {
                        e.preventDefault();
                        broadcastMessage('INFO', USERNAME, `${USERNAME} changed their username to ${document.getElementById('change-username').value}`, hostColor);
                        USERNAME = document.getElementById('change-username').value;
                        document.getElementById('change-username-modal').close();
                    });
            });

            peer.on('connection', (conn) => {
                // Save the connection using the guest's Peer ID
                connectedPeers[conn.peer] = conn;
                peerMap[conn.peer] = {
                    username: "Unknown User",
                    color: getRandomColor()
                };
                console.log(`Guest connected! ID: ${conn.peer}`);

                // recie=vireing data
                conn.on('data', (data) => {
                    if (data.username) {
                        peerMap[conn.peer].username = data.username;
                    }
                    const userColor = peerMap[conn.peer].color;
                    broadcastMessage(data.type, data.username, data.message, userColor);
                });

                // Remove the guest if they close the tab/disconnect
                conn.on('close', () => {
                    delete connectedPeers[conn.peer];
                    console.log(`Guest disconnected: ${conn.peer}`);
                    const leaveUser = peerMap[conn.peer].username;
                    const leaveMsg = getFunnyLeaveMessage(peerMap[conn.peer].username);
                    const userColor = peerMap[conn.peer].color;
                    broadcastMessage('WARN', leaveUser, leaveMsg, userColor);
                });
            });

            peer.on('error', (err) => {
                console.error('Peer connection error:', err);
            });
        });

        function broadcastMessage(type, user, msg, color) {
            Object.values(connectedPeers).forEach(conn => {
                if (conn.open) {
                    conn.send({
                        type: type,
                        username: user,
                        message: msg,
                        color: color
                    });
                }
            });
            addMessageToDOM(type, user, msg, color);
        }

        // JOINING
        // Get the form, and apply listend
        const joinForm = document.getElementById('join-form');
        joinForm.addEventListener('submit', (e) => {

            //  Start loading
            loadScreen.classList.remove('hidden');
            e.preventDefault();

            // make sure we have a code
            const joinCode = document.getElementById('join-code').value.trim();
            if (!joinCode) return;

            // reset peer.js
            if (peer) {
                peer.destroy();
                peer = null;
            }
            peer = new Peer();

            // peer connections
            peer.on('open', (id) => {
                // when peer loads
                loadScreen.classList.add('hidden');
                console.log('User initialized with ID:', id);

                // try to connect
                const conn = peer.connect(joinCode);

                // set joincode thing
                const codeOutput = document.getElementById('room-code');
                codeOutput.innerText = joinCode;

                // when connected
                conn.on('open', () => {

                    // switch to chat ui
                    switchToChat();

                    console.log('Successfully connected to host!');
                    
                    // send init message
                    conn.send({
                        type: "INFO",
                        username: USERNAME,
                        message: `${USERNAME} has joined.`
                    });

                    // Sending Messages
                    const sendMsgForm = document.getElementById('send-message-form');
                    sendMsgForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const msg = document.getElementById('send-message').value;
                        conn.send({
                            type: "MESSAGE",
                            username: USERNAME,
                            message: msg
                        });
                        sendMsgForm.reset();
                    });

                    const changeUserForm = document.getElementById('change-user-form');
                    changeUserForm.addEventListener("submit", (e) => {
                        e.preventDefault();
                        conn.send({
                            type: "INFO",
                            username: USERNAME,
                            message: `${USERNAME} changed their username to ${document.getElementById('change-username').value}`
                        });
                        USERNAME = document.getElementById('change-username').value;
                        document.getElementById('change-username-modal').close();
                    });

                    // Reciving Messages
                    conn.on('data', (data) => {
                        addMessageToDOM(data.type, data.username, data.message, data.color);
                    });
                });

                conn.on('error', (err) => {
                    console.error('Connection error:', err);
                    cleanupFailedJoin('Failed to connect to room');
                });
            });
            peer.on('error', (err) => {
                console.error('Guest peer error:', err);
                cleanupFailedJoin('Room code incorrect or room does not exist');
            });
        });

        function cleanupFailedJoin(message) {
            loadScreen.classList.add('hidden');
            document.getElementById('join-error-out').innerText = message;
            if (peer) {
                peer.destroy();
                peer = null;
            }
        }
    </script>

    <!-- Drawing App -->
    <script type="module">
        // handle fullscreen
        document.getElementById('draw-fullscreen').addEventListener('click', () => {
            const drawCanvas = document.getElementById('draw-ui');
            if (drawCanvas.requestFullscreen) {
                drawCanvas.requestFullscreen();
            } else if (drawCanvas.webkitRequestFullscreen) { /* Safari */
                drawCanvas.webkitRequestFullscreen();
            } else if (drawCanvas.msRequestFullscreen) { /* IE11 */
                drawCanvas.msRequestFullscreen();
            }
        });

        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const colorPicker = document.getElementById('draw-color');
        const sizePicker = document.getElementById('draw-size');
        const clearBtn = document.getElementById('draw-clear');
        const fullscreenBtn = document.getElementById('draw-fullscreen');
        let isDrawing = false;
        let currentMode = 'draw';
        let sprayAnimationId = null;
        let lastX = 0;
        let lastY = 0;
        const undoStack = [];
        const redoStack = [];
        const MAX_HISTORY = 20; // Limit history size to prevent memory leaks

        function resizeCanvas() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.drawImage(tempCanvas, 0, 0);
        }
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);

        function saveState() {
            redoStack.length = 0;
            if (undoStack.length >= MAX_HISTORY) {
                undoStack.shift(); 
            }
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }
        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const previousState = undoStack.pop();
            ctx.putImageData(previousState, 0, 0);
        }
        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            const nextState = redoStack.pop();
            ctx.putImageData(nextState, 0, 0);
        }
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }
        function startDrawing(e) {
            const coords = getCoordinates(e);
            saveState();
            if (currentMode === 'fill') {
                floodFill(Math.floor(coords.x), Math.floor(coords.y), colorPicker.value);
            } else {
                isDrawing = true;
                lastX = coords.x;
                lastY = coords.y;
                if (currentMode === 'spray') {
                    spray(coords.x, coords.y);
                }
            }
        }
        function draw(e) {
            if (!isDrawing) return;
            const coords = getCoordinates(e);
            if (currentMode === 'spray') {
                lastX = coords.x;
                lastY = coords.y;
            } else {
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(coords.x, coords.y);
                ctx.strokeStyle = colorPicker.value;
                ctx.lineWidth = sizePicker.value;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                lastX = coords.x;
                lastY = coords.y;
            }
        }
        function stopDrawing() {
            isDrawing = false;
            if (sprayAnimationId) {
                cancelAnimationFrame(sprayAnimationId);
                sprayAnimationId = null;
            }
        }
        function floodFill(startX, startY, fillColorHex) {
            const width = canvas.width;
            const height = canvas.height;
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            let c = fillColorHex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            const fillColor = [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
            const startIdx = (startY * width + startX) * 4;
            const targetColor = [data[startIdx], data[startIdx + 1], data[startIdx + 2], data[startIdx + 3]];

            if (fillColor.every((val, i) => Math.abs(val - targetColor[i]) < 5)) return;

            function matchTarget(idx) {
                return Math.abs(data[idx] - targetColor[0]) < 10 &&
                    Math.abs(data[idx + 1] - targetColor[1]) < 10 &&
                    Math.abs(data[idx + 2] - targetColor[2]) < 10 &&
                    Math.abs(data[idx + 3] - targetColor[3]) < 10;
            }
            function setPixel(idx) {
                data[idx] = fillColor[0];
                data[idx + 1] = fillColor[1];
                data[idx + 2] = fillColor[2];
                data[idx + 3] = fillColor[3];
            }

            const stack = [[startX, startY]];
            while (stack.length > 0) {
                const [x, y] = stack.pop();
                let currentY = y;
                while (currentY >= 0 && matchTarget((currentY * width + x) * 4)) {
                    currentY--;
                }
                currentY++;

                let reachLeft = false;
                let reachRight = false;
                while (currentY < height && matchTarget((currentY * width + x) * 4)) {
                    const idx = (currentY * width + x) * 4;
                    setPixel(idx);

                    if (x > 0) {
                        if (matchTarget(idx - 4)) {
                            if (!reachLeft) {
                                stack.push([x - 1, currentY]);
                                reachLeft = true;
                            }
                        } else if (reachLeft) {
                            reachLeft = false;
                        }
                    }
                    if (x < width - 1) {
                        if (matchTarget(idx + 4)) {
                            if (!reachRight) {
                                stack.push([x + 1, currentY]);
                                reachRight = true;
                            }
                        } else if (reachRight) {
                            reachRight = false;
                        }
                    }
                    currentY++;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }
        function spray(x, y) {
            if (!isDrawing || currentMode !== 'spray') return;

            const density = Number(sizePicker.value) * 4; // Number of dots per frame
            const radius = Number(sizePicker.value) * 2;  // Radius of spray area

            ctx.fillStyle = colorPicker.value;

            for (let i = 0; i < density; i++) {
                const offsetAngle = Math.random() * 2 * Math.PI;
                const offsetRadius = Math.random() * radius;
                const dotX = lastX + offsetRadius * Math.cos(offsetAngle);
                const dotY = lastY + offsetRadius * Math.sin(offsetAngle);

                ctx.fillRect(dotX, dotY, 1, 1);
            }

            sprayAnimationId = requestAnimationFrame(() => spray(lastX, lastY));
        }

        document.getElementById('draw-mode-btn').addEventListener('click', () => currentMode = 'draw');
        document.getElementById('draw-fill-btn').addEventListener('click', () => currentMode = 'fill');
        document.getElementById('draw-spray-btn').addEventListener('click', () => currentMode = 'spray');

        document.getElementById('draw-undo').addEventListener('click', undo);
        document.getElementById('draw-redo').addEventListener('click', redo);

        clearBtn.addEventListener('click', () => {
            saveState();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startDrawing(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            draw(e);
        }, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        document.getElementById('draw-export').addEventListener('click', () => {
            const imageBlob = canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'drawing.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                link.href = '';
                URL.revokeObjectURL(url);
            });
        });
    </script>
