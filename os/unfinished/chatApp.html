        section {

        .card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            padding: clamp(1.25rem, 5vw, 2.5rem);

            -webkit-backdrop-filter: blur(16px);
            
            border: 1px solid rgba(138, 115, 254, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            text-wrap: balance;
            overflow-y: auto;

            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;

            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card p {
            font-size: clamp(0.9rem, 3vw, 1rem);
            opacity: 0.9;
        }
        .card .container{
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            flex-direction: column;
        }
        hr {
            width: 100%;
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(138, 115, 254, 0.3), transparent);
            margin: 0.25rem 0;
        }

        /* Form & Controls Layout */
        #join-form, #send-message-form {
            width: 100%;
            display: flex;
            gap: 0.75rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(138, 115, 254, 0.3);
            background: rgba(15, 5, 30, 0.6);

            font-size: 0.95rem;
            transition: all 0.25s ease;

        input[type="text"]:focus {
            border-color: #8a73fe;
            box-shadow: 0 0 12px rgba(138, 115, 254, 0.4);
            background: rgba(15, 5, 30, 0.8);

        input[type="text"]::placeholder {

        button {

            align-items: center;

            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);

<body>
    <div class="load-screen hidden" id="ldr-screen">
        <h1>Loading...</h1>
        <l-quantum
            size="200"
            speed="1.75"
            color="#4294ff">
        </l-quantum>
    </div>

    <section id="start">
        <div class="card">
            <h1>Welcome to Quasar Chat</h1>
            <p>Your squad. Your space. Instant private chatrooms created in one click.</p>
            <hr>
            <h2>Make a room</h2>
            <div class="container">
                 <button id="create-room-btn">Create Room</button>
            </div>
            <hr>
            <h2>Or join one!</h2>
            <form id="join-form">
                <input type="text" placeholder="Join Code" id="join-code" required>
                <button type="submit">Join</button>
            </form>
            <p id="join-error-out"></p>
        </div>
    </section>
    
    <section class="hidden" id="chat-sys">
            <div id="room-code-container">
                <span id="room-code">Room Code Will Appear Here</span>
            </div>
            <!-- messages -->
            <message-box></message-box>

            <form id="send-message-form">
                <input type="text" placeholder="Type your message..." id="send-message">
                <button type="submit">
                    Send
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M120-160v-640l760 320-760 320Zm80-120 474-200-474-200v140l240 60-240 60v140Zm0 0v-400 400Z"/></svg>
                </button>
            </form>
    </section>

    <!-- Username Mgr -->
    <script>
        const peerMap = {};
        let USERNAME = "user";
        for(let i = 0; i < 6; i++) {
            USERNAME += String(Math.floor(Math.random() * 10));
        }
    </script>

    <!-- Useful js -->
    <script>
        function addMessageToDOM(type, username, text, color) {
            const messageBox = document.querySelector('message-box');
            const bubble = document.createElement('message-bubble');

            if(type === 'MESSAGE') {
                const h3 = document.createElement('h3');
                if(username === USERNAME) {
                    h3.textContent = "You";
                    h3.style.color = "#FFFFFF";
                } else {
                    h3.textContent = username;
                    h3.style.color = color;
                }
                bubble.appendChild(h3);
                bubble.classList.add('message');
            } else {
                if(type === 'INFO') {
                    bubble.classList.add('info');
                } else {
                    if(type === 'WARN') {
                        bubble.classList.add('warn');
                    }
                }
            }

            const p = document.createElement('p');
            p.textContent = text;
            
            bubble.appendChild(p);
            messageBox.appendChild(bubble);

            messageBox.scrollTop = messageBox.scrollHeight;
        }
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 75%, 45%)`;
        }
        function getFunnyLeaveMessage(username) {
            const messages = [
                `${username} rage quit! 🚪💥`,
                `${username} vanished into the shadow realm. 🌌`,
                `${username} left to go get milk and never came back. 🥛`,
                `${username} disconnected. Probably lost their Wi-Fi to a squirrel. 🐿️`,
                `${username} has left the chat. Fs in the chat, boys. 🫡`
            ];
            return messages[Math.floor(Math.random() * messages.length)];
        }
    </script>

    <!-- Both -->
    <script>
        let peer;
        const loadScreen = document.getElementById('ldr-screen');
        const startScreen = document.getElementById('start');
        const chatScreen = document.getElementById('chat-sys');
        function switchToChat() {
            startScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
        }
    </script>

    <!-- Create Room -->
    <script>
        let hostColor;
        let connectedPeers = {};

        // get join thingy magigy
        const createRoomBtn = document.getElementById('create-room-btn');
        createRoomBtn.addEventListener("click", () => {

            // Genertae room code
            const codeOutput = document.getElementById('room-code');
            let roomCode = "Q";
            for( let i = 0; i < 6; i++) {
                roomCode += String(Math.floor(Math.random() * 10));
            }
            codeOutput.innerText = roomCode;

            // Peer connection headache
            if(!peer) {
                peer = new Peer(roomCode);
            }

            peer.on('open', (id) => {
                switchToChat();
                console.log('Room created successfully with ID:', id);
                hostColor = getRandomColor();

                // send message
                const sendMsgForm = document.getElementById('send-message-form');
                sendMsgForm.addEventListener("submit", (e) => {
                    e.preventDefault();
                    const msg = document.getElementById('send-message').value;
                    broadcastMessage('MESSAGE', USERNAME, msg, hostColor);
                    sendMsgForm.reset();
                });
            });

            peer.on('connection', (conn) => {
                // Save the connection using the guest's Peer ID
                connectedPeers[conn.peer] = conn;
                peerMap[conn.peer] = {
                    username: "Unknown User",
                    color: getRandomColor()
                };
                console.log(`Guest connected! ID: ${conn.peer}`);

                // recie=vireing data
                conn.on('data', (data) => {
                    if (data.username) {
                        peerMap[conn.peer].username = data.username;
                    }
                    const userColor = peerMap[conn.peer].color;
                    broadcastMessage(data.type, data.username, data.message, userColor);
                });

                // Remove the guest if they close the tab/disconnect
                conn.on('close', () => {
                    delete connectedPeers[conn.peer];
                    console.log(`Guest disconnected: ${conn.peer}`);
                    const leaveUser = peerMap[conn.peer].username;
                    const leaveMsg = getFunnyLeaveMessage(peerMap[conn.peer].username);
                    const userColor = peerMap[conn.peer].color;
                    broadcastMessage('WARN', leaveUser, leaveMsg, userColor);
                });
            });

            peer.on('error', (err) => {
                console.error('Peer connection error:', err);
            });
        });

        function broadcastMessage(type, user, msg, color) {
            Object.values(connectedPeers).forEach(conn => {
                if (conn.open) {
                    conn.send({
                        type: type,
                        username: user,
                        message: msg,
                        color: color
                    });
                }
            });
            addMessageToDOM(type, user, msg, color);
        }
    </script>

    <!-- Join Room -->
    <script>
        // Get the form, and apply listend
        const joinForm = document.getElementById('join-form');
        joinForm.addEventListener('submit', (e) => {

            //  Start loading
            loadScreen.classList.remove('hidden');
            e.preventDefault();

            // make sure we have a code
            const joinCode = document.getElementById('join-code').value.trim();
            if (!joinCode) return;

            // reset peer.js
            if (peer) {
                peer.destroy();
                peer = null;
            }
            peer = new Peer();

            // peer connections
            peer.on('open', (id) => {
                // when peer loads
                loadScreen.classList.add('hidden');
                console.log('User initialized with ID:', id);

                // try to connect
                const conn = peer.connect(joinCode);

                // set joincode thing
                const codeOutput = document.getElementById('room-code');
                codeOutput.innerText = joinCode;

                // when connected
                conn.on('open', () => {

                    // switch to chat ui
                    switchToChat();

                    console.log('Successfully connected to host!');
                    
                    // send init message
                    conn.send({
                        type: "INFO",
                        username: USERNAME,
                        message: `${USERNAME} has joined.`
                    });

                    // Sending Messages
                    const sendMsgForm = document.getElementById('send-message-form');
                    sendMsgForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const msg = document.getElementById('send-message').value;
                        conn.send({
                            type: "MESSAGE",
                            username: USERNAME,
                            message: msg
                        });
                        sendMsgForm.reset();
                    });

                    // Reciving Messages
                    conn.on('data', (data) => {
                        addMessageToDOM(data.type, data.username, data.message, data.color);
                    });
                });

                conn.on('error', (err) => {
                    console.error('Connection error:', err);
                    cleanupFailedJoin('Failed to connect to room');
                });
            });
            peer.on('error', (err) => {
                console.error('Guest peer error:', err);
                cleanupFailedJoin('Room code incorrect or room does not exist');
            });
        });

        function cleanupFailedJoin(message) {
            loadScreen.classList.add('hidden');
            document.getElementById('join-error-out').innerText = message;
            if (peer) {
                peer.destroy();
                peer = null;
            }
        }
    </script>
</body>
</html>
