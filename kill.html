<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature not ready</title>

    <!-- css -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap');
        *{
            margin: 0;
            padding: 0;
        }
        body{
            width: 100%;
            height: 100vh;
            position: relative;
        }
        canvas{
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }
        .text{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
        }
        .text h1{
            font-family: "Exo 2", Arial, Helvetica, sans-serif;
            color: white;
            font-size: min(6rem, 8vw);
        }
        .text p{
            color: white;
            font-family: "Nunito", Arial, Helvetica, sans-serif;
        }
        .text a{
            color: #0d57c7;
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div class="text">
        <h1>Oops</h1>
        <p>Sorry, this feature isn't ready for you to view yet! Try going back to the <a href="/home/">home</a></p>
    </div>
    <script type="module">
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const STAR_COUNT = 800;
        const SPEED = 1;
        const stars = [];

        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width;
                this.pz = this.z;
            }

            update() {
                this.pz = this.z;
                this.z -= SPEED;

                if (this.z <= 0) {
                    this.reset();
                    this.pz = this.z;
                }
            }

            draw() {
                const cx = width / 2;
                const cy = height / 2;

                // Current position mapped to screen space
                const x = (this.x / this.z) * width + cx;
                const y = (this.y / this.z) * height + cy;

                // Previous position mapped to screen space (creates the line streak)
                const px = (this.x / this.pz) * width + cx;
                const py = (this.y / this.pz) * height + cy;

                // Skip rendering if out of bounds
                if (x < 0 || x > width || y < 0 || y > height) return;

                // Fade lines as stars get closer to center
                const alpha = 1 - this.z / width;

                ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.lineWidth = (1 - this.z / width) * 2.5;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        }

        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push(new Star());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            for (const star of stars) {
                star.update();
                star.draw();
            }

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
